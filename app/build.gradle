plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mipulsebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.mipulsebridge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // LSPosed / Xposed API —— 只参与编译,不打包进 APK
    compileOnly 'de.robv.android.xposed:api:82'
}
